# Stock Lab Streamlit Secrets template.
# Copy these values into Streamlit Cloud -> Manage app -> Settings -> Secrets.
# Do not rename this file to secrets.toml inside Git, and do not paste real keys here.

AUTH_MODE = "google"

ALLOWED_EMAILS = [
  "your-email@example.com",
]

ADMIN_EMAILS = [
  "your-email@example.com",
]

SUPABASE_URL = "https://your-project-ref.supabase.co"
SUPABASE_SERVICE_ROLE_KEY = "replace-with-new-service-role-key"

dart_api_key = "replace-with-dart-api-key"
fmp_api_key = "replace-with-fmp-api-key"

# Optional. Korea Investment OpenAPI broker quote source.
# If set, US stock/ETF prices use this broker quote before public quote fallbacks.
KIS_APP_KEY = ""
KIS_APP_SECRET = ""
KIS_BASE_URL = "https://openapi.koreainvestment.com:9443"
# Optional per-symbol exchange override. RAM daytime trading usually tries BAA first.
# KIS_EXCD_RAM = "BAA,AMS"

# Optional. Used only if you enable KRX data API fallback.
krx_api_key = ""

# Optional. SEC asks apps to identify themselves when using company filings.
SEC_USER_AGENT = "your-name your-email@example.com"

[auth]
redirect_uri = "https://your-app-name.streamlit.app/oauth2callback"
cookie_secret = "replace-with-random-long-secret"
client_id = "replace-with-google-oauth-client-id"
client_secret = "replace-with-google-oauth-client-secret"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
